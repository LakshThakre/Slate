[package]
name = "slate"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
fs2 = "0.4"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.17"
assert_cmd = "2.0"
predicates = "3.1"
